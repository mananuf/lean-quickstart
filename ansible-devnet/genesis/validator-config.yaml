shuffle: roundrobin
# devnet-5 leanVM, single host, sized to fit ~31GB RAM.
#
# gean documents a ~12GiB working set per PROVING node (cmd/gean/memory.go:
# proverMemoryFloorBytes), so a 31GB box supports only a few provers. This is
# 6 nodes x 2 validators = 12 validators over 2 subnets, not the 32-node /
# 1024-validator shape of the observed run, which needs one node per host.
#
# What it does preserve, which is what the aggregation investigation needs:
#  - node_count (6) is a multiple of committee_count (2), so round-robin
#    assignment puts every node's validators on a single subnet
#  - one aggregator per subnet, gean_0 among them
#  - >=2 validators per subnet, so an aggregate can reach the 2-signer minimum
#
# Ports strided per node: quic 9001+i, metrics 8081+i, api 5051+i.
deployment_mode: ansible
config:
  activeEpoch: 18
  keyType: "hash-sig"
  attestation_committee_count: 2
validators:
  - name: "gean_0"
    privkey: "125d9d1c4234236859df61ffbdfe7b1907fc8de44ac4ee1b3bff311c642848f1"
    enrFields:
      ip: "100.99.168.92"
      quic: 9001
    metricsPort: 8081
    apiPort: 5051
    subnet: 0
    isAggregator: true
    count: 2
  - name: "ethlambda_1"
    privkey: "1cbac426df28c04ea11ef9ef43bf739e77ee28ea725b1304c08bf1ebac072274"
    enrFields:
      ip: "100.99.168.92"
      quic: 9002
    metricsPort: 8082
    apiPort: 5052
    subnet: 1
    isAggregator: true
    count: 2
  - name: "gean_2"
    privkey: "e747185bdf71bc1a3856b451bf37e7a71b053cbf7cf610413aa071cb69fce5ea"
    enrFields:
      ip: "100.99.168.92"
      quic: 9003
    metricsPort: 8083
    apiPort: 5053
    subnet: 0
    isAggregator: false
    count: 2
  - name: "grandine_3"
    privkey: "dd947f669d313430b23b05bf0622e4a48024c3d1778f16a16c581d36be62373f"
    enrFields:
