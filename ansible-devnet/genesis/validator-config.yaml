shuffle: roundrobin
# devnet-5 leanVM, 32 nodes x 32 validators = 1024 genesis validators.
# Reproduces the run observed at 2026-08-31 14:35-15:04 UTC on the
# lean-ethereum clients dashboard (network=devnet-5).
#
# Composition: 7 ethlambda, 7 grandine, 7 lantern, 7 gean, 4 ream.
# Validators are assigned round-robin over the 32 node slots, so node i
# owns validator indices congruent to i (mod 32). Attestation subnet is
# validator_index % 8, and 32 is a multiple of 8, so every validator a
# node owns lands on the same subnet: subnet = node_index % 8.
#
# Aggregators: one per subnet (ethlambda_0, lantern_2, gean_7, grandine_12,
# gean_17, lantern_27, ethlambda_29, grandine_30) covering subnets 0-7.
#
# Node keys are generated deterministically for this config and are NOT the
# keys the observed run used; regenerate genesis before starting.
