shuffle: roundrobin
# devnet-5 leanVM on a SINGLE host: 32 nodes x 32 validators = 1024 validators.
# Mirrors the run observed 2026-08-31 14:35-15:04 UTC (network=devnet-5):
# 7 ethlambda, 7 grandine, 7 lantern, 7 gean, 4 ream; 8 attestation subnets.
#
# All nodes share one IP, so ports are strided per node index and `subnet`
# is set explicitly: with several client types on one IP the name suffix
# alone is ambiguous to the tooling.
#   quic 9001+i   metrics 8081+i   api 5051+i   subnet = i % 8
#
# Aggregators: one per subnet (ethlambda_0, lantern_2, gean_7, grandine_12,
# gean_17, lantern_27, ethlambda_29, grandine_30).
#
# Node keys are derived deterministically here and are not the observed
# run's keys; genesis is regenerated on deploy.
